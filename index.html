<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LocaL - Proximity Social Network</title>
  
  <!-- PWA & Mobile Icons -->
  <meta name="theme-color" content="#dbeafe">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LocaL">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PeerJS for Real-time WebRTC P2P Data Sync -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    @keyframes wave-expand {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(3.8); opacity: 0; }
    }
    @keyframes tap-ripple-expand {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0.9; border-width: 4px; }
      100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; border-width: 1px; }
    }
    @keyframes liquid-bounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.22) translateY(-4px); }
      50% { transform: scale(0.92) translateY(2px); }
      75% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* Slow Ambient Radar Waves (6 seconds) */
    .animate-wave-slow {
      animation: wave-expand 6s cubic-bezier(0.1, 0.7, 0.3, 1) infinite;
    }
    .animate-tap-ripple {
      animation: tap-ripple-expand 0.8s ease-out forwards;
    }
    .animate-bounce-click {
      animation: liquid-bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Liquid Glass UI Styling */
    .glass-panel {
      background: rgba(255, 255, 255, 0.60);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
    }
    .glass-card {
      background: rgba(240, 249, 255, 0.70);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(186, 230, 253, 0.75);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .liquid-glass-icon {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(186, 230, 253, 0.45) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.25), inset 0 2px 4px rgba(255, 255, 255, 0.9);
    }
    .liquid-node {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3), inset 0 2px 6px rgba(255, 255, 255, 0.8);
    }
    /* Ultra-Transparent iPhone Left Side Chat Drawer */
    .glass-drawer-left {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-right: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 15px 0 40px rgba(0, 0, 0, 0.12);
    }
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans antialiased overflow-hidden h-screen w-screen relative">

  <!-- Dynamic Liquid Map Canvas Background -->
  <div id="mapCanvas" class="absolute inset-0 bg-gradient-to-br from-sky-200 via-blue-100 to-indigo-200 overflow-hidden cursor-grab active:cursor-grabbing transition-transform duration-500 origin-center" style="transform: scale(1.1);">
    <!-- Grid Overlay -->
    <div class="absolute inset-0 opacity-25 bg-[radial-gradient(#0284c7_1px,transparent_1px)] [background-size:24px_24px]"></div>

    <!-- Slow Ambient Ripple Radar Rings originating from Center Avatar -->
    <div id="radarCenter" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none transition-transform duration-500 origin-center" style="transform: translate(-50%, -50%) scale(1);">
      <div class="w-[320px] h-[320px] rounded-full border-2 border-cyan-400/40 absolute -translate-x-1/2 -translate-y-1/2 animate-wave-slow"></div>
      <div class="w-[320px] h-[320px] rounded-full border-2 border-sky-400/30 absolute -translate-x-1/2 -translate-y-1/2 animate-wave-slow" style="animation-delay: 2s;"></div>
      <div class="w-[320px] h-[320px] rounded-full border-2 border-blue-400/20 absolute -translate-x-1/2 -translate-y-1/2 animate-wave-slow" style="animation-delay: 4s;"></div>
      
      <!-- Container for Tap Water Ripples -->
      <div id="tapRippleContainer" class="absolute inset-0"></div>
    </div>

    <!-- Map Nodes Container -->
    <div id="nodesContainer" class="absolute inset-0"></div>
  </div>

  <!-- Top Floating Header Bar -->
  <header class="absolute top-3 left-3 right-3 z-30 flex items-center justify-between pointer-events-none">
    <div class="glass-panel px-3.5 py-2 rounded-2xl shadow-lg shadow-sky-900/10 flex items-center gap-3 pointer-events-auto">
      <div class="relative flex items-center justify-center">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-cyan-500/30 border border-white/60">
          L
        </div>
        <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-cyan-400 rounded-full border-2 border-white"></div>
      </div>
      <div>
        <h1 class="font-bold text-slate-800 text-sm leading-tight tracking-tight">LocaL</h1>
        <div class="flex items-center gap-2">
          <p id="radarStatusText" class="text-[10px] text-sky-800 font-medium">Radar: 50m</p>
          <span class="text-[9px] text-slate-400">•</span>
          <!-- Real-time Active Users Counter -->
          <div id="activeUserBadge" class="flex items-center gap-1 text-[10px] text-emerald-700 font-bold bg-emerald-500/15 px-1.5 py-0.5 rounded-full border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="activeUserCount">1 Active</span>
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2 pointer-events-auto">
      <button onclick="toggleP2PModal()" title="P2P Synchronization" class="liquid-glass-icon p-2.5 rounded-2xl text-sky-800 hover:bg-white/80 transition-all active:scale-95 relative">
        <i data-lucide="wifi" class="w-5 h-5"></i>
        <span id="p2pStatusDot" class="absolute top-2 right-2 w-2 h-2 rounded-full bg-slate-400"></span>
      </button>

      <button onclick="toggleHelpModal()" title="Help Guide" class="liquid-glass-icon p-2.5 rounded-2xl text-sky-800 hover:bg-white/80 transition-all active:scale-95">
        <i data-lucide="help-circle" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="absolute top-20 left-4 right-4 z-40 pointer-events-none flex flex-col gap-2 items-center"></div>

  <!-- Bottom Quick Controls Dock -->
  <div class="absolute bottom-6 right-4 z-30 flex flex-col gap-2 pointer-events-auto">
    <button onclick="centerMapOnUser()" class="liquid-glass-icon p-3 rounded-2xl text-sky-800 hover:bg-white active:scale-95 flex items-center justify-center" title="Center Map">
      <i data-lucide="crosshair" class="w-5 h-5"></i>
    </button>
    <button onclick="openChatDrawer('Anonymous User', 'bg-sky-500', null)" class="liquid-glass-icon p-3 rounded-2xl text-sky-800 hover:bg-white active:scale-95 flex items-center justify-center" title="Open Chat">
      <i data-lucide="message-square" class="w-5 h-5"></i>
    </button>
    <button onclick="openQuestionModal()" class="liquid-glass-icon p-3 rounded-2xl text-sky-800 hover:bg-white active:scale-95 flex items-center justify-center" title="Ask Local Question">
      <i data-lucide="message-square-plus" class="w-5 h-5"></i>
    </button>
    <button onclick="toggleRangeModal()" class="liquid-glass-icon p-3 rounded-2xl text-sky-800 hover:bg-white active:scale-95 flex items-center justify-center" title="Adjust Radius">
      <i data-lucide="radar" class="w-5 h-5"></i>
    </button>
  </div>

  <!-- Range Slider Modal -->
  <div id="rangeModal" class="hidden absolute bottom-20 right-4 z-40 glass-card p-4 rounded-3xl w-72 shadow-2xl border border-sky-200">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="sliders" class="w-4 h-4 text-sky-600"></i>
        <span class="text-xs font-bold text-slate-800 uppercase tracking-wider">Discovery Radius</span>
      </div>
      <button onclick="toggleRangeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="flex items-center gap-3">
      <input type="range" id="radiusSlider" min="10" max="200" value="50" oninput="updateRadius(this.value)" class="w-full accent-sky-500 cursor-pointer">
      <span id="radiusValueDisplay" class="text-xs font-bold text-sky-700 min-w-[40px] text-right">50m</span>
    </div>
  </div>

  <!-- Left Side Ultra-Transparent iPhone-Style Chat Drawer -->
  <div id="chatDrawer" class="hidden fixed top-0 bottom-0 left-0 z-40 w-80 max-w-[85vw] glass-drawer-left p-4 flex flex-col transition-all">
    <div class="flex items-center justify-between pb-3 pt-2 border-b border-white/20">
      <div class="flex items-center gap-2.5">
        <div id="chatTargetAvatar" class="w-9 h-9 rounded-full liquid-node bg-sky-500 text-white font-bold text-sm flex items-center justify-center">?</div>
        <div>
          <h4 id="chatTargetName" class="font-bold text-slate-900 text-sm drop-shadow-sm">Anonymous User</h4>
          <p id="chatTargetStatus" class="text-[10px] text-sky-800 font-semibold">Proximity Session</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="toggleRevealIdentity()" id="revealBtn" class="px-2.5 py-1 rounded-xl bg-white/40 hover:bg-white/60 text-sky-900 font-bold text-[11px] shadow-sm transition-all border border-white/50">
          Reveal
        </button>
        <button onclick="closeChatDrawer()" class="text-slate-700 hover:text-slate-900 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
    </div>

    <!-- Main Topic Sticky Header -->
    <div id="mainTopicContainer" class="hidden my-2.5 p-3 rounded-2xl bg-white/40 backdrop-blur-md border border-white/60 shadow-sm flex items-start gap-2">
      <i data-lucide="pin" class="w-4 h-4 text-sky-700 flex-shrink-0 mt-0.5"></i>
      <div>
        <span class="text-[10px] font-bold text-sky-800 uppercase tracking-wider block">Main Topic</span>
        <p id="mainTopicText" class="text-xs font-semibold text-slate-900 leading-snug"></p>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="chatMessages" class="flex-1 overflow-y-auto py-2 space-y-3"></div>

    <!-- Input Bar -->
    <div class="flex gap-2 pt-3 border-t border-white/20">
      <input type="text" id="chatInput" placeholder="iMessage..." class="flex-1 px-4 py-2.5 rounded-full bg-white/30 backdrop-blur-md border border-white/50 text-slate-900 text-xs placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-400" onkeypress="if(event.key==='Enter') sendChatMessage()">
      <button onclick="sendChatMessage()" class="w-9 h-9 rounded-full bg-blue-500 text-white font-bold flex items-center justify-center shadow-md active:scale-95 transition-all flex-shrink-0">
        <i data-lucide="arrow-up" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Profile Edit Modal -->
  <div id="profileModal" class="hidden fixed inset-0 z-50 glass-panel bg-slate-900/20 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-white/80">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">Customize Profile</h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Display Alias</label>
          <input type="text" id="avatarNameInput" value="Aqua Voyager" class="w-full px-4 py-2.5 rounded-2xl bg-white/80 border border-sky-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Avatar Icon / Emoji</label>
          <div class="flex gap-2">
            <button onclick="selectAvatarIcon('💧')" class="w-10 h-10 rounded-xl bg-white/80 border border-sky-200 hover:bg-sky-100 flex items-center justify-center text-lg">💧</button>
            <button onclick="selectAvatarIcon('🌊')" class="w-10 h-10 rounded-xl bg-white/80 border border-sky-200 hover:bg-sky-100 flex items-center justify-center text-lg">🌊</button>
            <button onclick="selectAvatarIcon('⚡')" class="w-10 h-10 rounded-xl bg-white/80 border border-sky-200 hover:bg-sky-100 flex items-center justify-center text-lg">⚡</button>
            <button onclick="selectAvatarIcon('🛰️')" class="w-10 h-10 rounded-xl bg-white/80 border border-sky-200 hover:bg-sky-100 flex items-center justify-center text-lg">🛰️</button>
            <button onclick="selectAvatarIcon('🧭')" class="w-10 h-10 rounded-xl bg-white/80 border border-sky-200 hover:bg-sky-100 flex items-center justify-center text-lg">🧭</button>
            <button onclick="selectAvatarIcon('initial')" class="w-10 h-10 rounded-xl bg-white/80 border border-sky-200 hover:bg-sky-100 flex items-center justify-center text-xs font-bold text-sky-800">Aa</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Avatar Accent Color</label>
          <div class="flex gap-3">
            <button onclick="setAvatarColor('bg-cyan-500')" class="w-8 h-8 rounded-full bg-cyan-500 border-2 border-white shadow-md"></button>
            <button onclick="setAvatarColor('bg-sky-500')" class="w-8 h-8 rounded-full bg-sky-500 border-2 border-white shadow-md"></button>
            <button onclick="setAvatarColor('bg-blue-600')" class="w-8 h-8 rounded-full bg-blue-600 border-2 border-white shadow-md"></button>
            <button onclick="setAvatarColor('bg-indigo-500')" class="w-8 h-8 rounded-full bg-indigo-500 border-2 border-white shadow-md"></button>
            <button onclick="setAvatarColor('bg-teal-400')" class="w-8 h-8 rounded-full bg-teal-400 border-2 border-white shadow-md"></button>
          </div>
        </div>
        <button onclick="saveProfile()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-sm shadow-lg shadow-sky-500/25 active:scale-98 transition-all">
          Save Profile
        </button>
      </div>
    </div>
  </div>

  <!-- P2P Sync Modal -->
  <div id="p2pModal" class="hidden fixed inset-0 z-50 glass-panel bg-slate-900/20 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-white/80">
      <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
          <i data-lucide="wifi" class="w-5 h-5 text-sky-600"></i>
          <h3 class="text-lg font-bold text-slate-800">PeerJS P2P Sync</h3>
        </div>
        <button onclick="toggleP2PModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      
      <div class="space-y-4">
        <div class="bg-white/60 p-3.5 rounded-2xl border border-sky-100">
          <p class="text-xs text-slate-500 mb-1 font-medium">Your Unique Device Peer ID:</p>
          <div class="flex items-center justify-between">
            <span id="myPeerIdDisplay" class="font-mono font-bold text-sky-800 text-sm">Generating...</span>
            <button onclick="copyPeerLink()" class="px-3 py-1.5 rounded-xl bg-sky-500 text-white text-xs font-bold hover:bg-sky-600 active:scale-95 transition-all">
              Copy Link
            </button>
          </div>
        </div>

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-sky-200"></div>
          <span class="flex-shrink mx-3 text-xs text-slate-400 font-semibold">CONNECT TO NEARBY FRIEND</span>
          <div class="flex-grow border-t border-sky-200"></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Enter Friend's Peer ID or Link</label>
          <input type="text" id="targetPeerInput" placeholder="e.g. local-8f92a1" class="w-full px-4 py-2.5 rounded-2xl bg-white/80 border border-sky-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400">
        </div>

        <button onclick="connectToPeer()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-sm shadow-lg shadow-sky-500/25 active:scale-98 transition-all">
          Connect P2P Session
        </button>
      </div>
    </div>
  </div>

  <!-- Question Board Modal -->
  <div id="questionModal" class="hidden fixed inset-0 z-50 glass-panel bg-slate-900/20 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-white/80">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">Ask Nearby People</h3>
        <button onclick="closeQuestionModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-4">
        <textarea id="questionInput" rows="3" placeholder="e.g., Any good food trucks nearby? or How is the crowd at the cafe?" class="w-full p-3.5 rounded-2xl bg-white/80 border border-sky-200 text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 resize-none"></textarea>
        <button onclick="postQuestion()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-sm shadow-lg shadow-cyan-500/25 active:scale-98 transition-all">
          Post Map Bubble
        </button>
      </div>
    </div>
  </div>

  <!-- Help Guide Modal -->
  <div id="helpModal" class="hidden fixed inset-0 z-50 glass-panel bg-slate-900/20 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-white/80 max-h-[80vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">How to Use LocaL</h3>
        <button onclick="toggleHelpModal()" class="text-slate-400 hover:text
