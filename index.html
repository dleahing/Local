<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LocaL - Proximity Social Network</title>
  
  <!-- Mobile & PWA Configuration -->
  <meta name="theme-color" content="#fbcfe8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LocaL">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PeerJS WebRTC P2P Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    @keyframes wave-expand {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(3.8); opacity: 0; }
    }
    /* Ultra-Slow Water Ripple with thinner, translucent lines for seamless background blending */
    @keyframes water-ripple-expand {
      0% { transform: translate(-50%, -50%) scale(0.05); opacity: 0.6; border-width: 1.5px; }
      40% { opacity: 0.3; }
      100% { transform: translate(-50%, -50%) scale(60); opacity: 0; border-width: 0.5px; }
    }
    @keyframes bubble-subtle {
      0%, 100% { transform: scale(1); border-radius: 50%; }
      50% { transform: scale(1.02, 0.98); border-radius: 49% 51% 50% 50%; }
    }
    @keyframes bubble-jiggle {
      0% { transform: scale(1); }
      15% { transform: scale(1.25, 0.78) rotate(-4deg); }
      30% { transform: scale(0.82, 1.2) rotate(4deg); }
      45% { transform: scale(1.12, 0.88) rotate(-2deg); }
      60% { transform: scale(0.92, 1.06) rotate(1deg); }
      75% { transform: scale(1.04, 0.97); }
      100% { transform: scale(1); }
    }
    @keyframes float-gentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.42; transform: scale(1.08); }
    }

    .animate-wave-slow { animation: wave-expand 6s cubic-bezier(0.1, 0.7, 0.3, 1) infinite; }
    .animate-water-ripple { animation: water-ripple-expand 10.71s cubic-bezier(0.15, 0.65, 0.25, 1) forwards; }
    .animate-float { animation: float-gentle 3.8s ease-in-out infinite; }
    .animate-bubble-subtle { animation: bubble-subtle 6s ease-in-out infinite; }
    .animate-jiggle { animation: bubble-jiggle 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards; }
    .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }

    /* Theme Presets (Harmonized Pink Backgrounds with Inverted Accent Schemes) */
    .theme-sky { --bg-gradient: radial-gradient(circle at 50% 50%, #fdf2f8 0%, #fbcfe8 50%, #f472b6 100%); --accent: #db2777; }
    .theme-pink { --bg-gradient: radial-gradient(circle at 50% 50%, #e0f2fe 0%, #bae6fd 50%, #38bdf8 100%); --accent: #0284c7; }
    .theme-emerald { --bg-gradient: radial-gradient(circle at 50% 50%, #fdf4ff 0%, #f5d0fe 50%, #e879f9 100%); --accent: #c084fc; }
    .theme-violet { --bg-gradient: radial-gradient(circle at 50% 50%, #fef2f2 0%, #fecaca 50%, #f87171 100%); --accent: #ef4444; }

    /* Polished Glassmorphism System */
    .glass-panel {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.06);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.08);
    }
    .liquid-glass-icon {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.35) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    /* Completely Borderless Profile Bubble */
    .bubble-node {
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.5) 30%, rgba(56, 189, 248, 0.5) 70%, rgba(2, 132, 199, 0.7) 100%);
      backdrop-filter: blur(12px) saturate(190%);
      -webkit-backdrop-filter: blur(12px) saturate(190%);
      box-shadow: 
        0 6px 15px rgba(2, 132, 199, 0.2),
        inset 0 3px 8px rgba(255, 255, 255, 0.95),
        inset 0 -5px 10px rgba(2, 132, 199, 0.25),
        0 0 10px rgba(56, 189, 248, 0.4);
      position: relative;
      outline: none;
      border: none;
    }
    .bubble-node:focus, .bubble-node:active {
      outline: none;
      border: none;
      box-shadow: 
        0 6px 15px rgba(2, 132, 199, 0.2),
        inset 0 3px 8px rgba(255, 255, 255, 0.95),
        inset 0 -5px 10px rgba(2, 132, 199, 0.25),
        0 0 10px rgba(56, 189, 248, 0.4);
    }

    /* Borderless Peer Profile Bubble */
    .peer-bubble-node {
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.4) 30%, rgba(168, 85, 247, 0.45) 70%, rgba(126, 34, 206, 0.65) 100%);
      backdrop-filter: blur(12px) saturate(190%);
      -webkit-backdrop-filter: blur(12px) saturate(190%);
      box-shadow: 
        0 6px 15px rgba(126, 34, 206, 0.2),
        inset 0 3px 8px rgba(255, 255, 255, 0.95),
        inset 0 -5px 10px rgba(126, 34, 206, 0.25),
        0 0 10px rgba(216, 180, 254, 0.4);
      position: relative;
      outline: none;
      border: none;
    }
    .peer-bubble-node:focus, .peer-bubble-node:active {
      outline: none;
      border: none;
    }

    .bubble-glare {
      position: absolute;
      top: 10%;
      left: 18%;
      width: 42%;
      height: 25%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 50% 50% 0 0;
      transform: rotate(-22deg);
      pointer-events: none;
    }

    .glass-drawer-left {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border-right: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 20px 0 50px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body id="appBody" class="theme-sky bg-slate-900 text-slate-800 font-sans antialiased overflow-hidden h-screen w-screen relative">

  <!-- Map Canvas Container -->
  <div id="mapCanvas" class="absolute inset-0 overflow-hidden transition-transform duration-500 origin-center" style="background: var(--bg-gradient); transform: scale(1.1);">
    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:28px_28px]"></div>
    <div id="radarCenter" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none transition-transform duration-500 origin-center">
      <div class="w-[340px] h-[340px] rounded-full border border-sky-400/20 absolute -translate-x-1/2 -translate-y-1/2 animate-wave-slow"></div>
    </div>
    <!-- Water Ripple Container -->
    <div id="tapRippleContainer" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>
    <div id="nodesContainer" class="absolute inset-0 z-20"></div>
  </div>

  <!-- Top Glass Header Bar -->
  <header class="absolute top-3 left-3 right-3 z-30 flex items-center justify-between pointer-events-none">
    <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 pointer-events-auto shadow-xl">
      <div class="relative flex items-center justify-center">
        <div id="logoBadge" class="w-8 h-8 rounded-xl bg-sky-600 flex items-center justify-center text-white font-black text-lg border border-white/40">L</div>
        <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 rounded-full border-2 border-white"></div>
      </div>
      <div>
        <h1 class="font-black text-slate-900 text-sm leading-tight tracking-tight">LocaL</h1>
        <div class="flex items-center gap-2">
          <p id="accountTypeDisplay" class="text-[10px] text-sky-900 font-bold uppercase tracking-wider">Personal (GPS)</p>
          <span class="text-[9px] text-slate-400">•</span>
          <div id="activeUserBadge" class="flex items-center gap-1 text-[10px] text-emerald-800 font-bold bg-emerald-500/20 px-2 py-0.5 rounded-full border border-emerald-500/30">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="activeUserCount">1 Active</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Top Active Chats Quick-Selection Tray -->
    <div id="activeChatsBar" class="hidden glass-panel px-3 py-1.5 rounded-2xl pointer-events-auto flex items-center gap-2 overflow-x-auto shadow-lg max-w-[45vw]"></div>

    <div class="flex items-center gap-2 pointer-events-auto">
      <button onclick="openProfileModal()" title="Customize Profile" class="liquid-glass-icon p-2.5 rounded-2xl text-slate-800 hover:scale-105 transition-all active:scale-95 shadow-lg">
        <i data-lucide="user-cog" class="w-5 h-5"></i>
      </button>

      <button onclick="toggleP2PModal()" title="Mesh Status" class="liquid-glass-icon p-2.5 rounded-2xl text-slate-800 hover:scale-105 transition-all active:scale-95 relative shadow-lg">
        <i data-lucide="wifi" class="w-5 h-5"></i>
        <span id="p2pStatusDot" class="absolute top-2 right-2 w-2 h-2 rounded-full bg-slate-400"></span>
      </button>
    </div>
  </header>

  <div id="toastContainer" class="absolute top-20 left-4 right-4 z-40 pointer-events-none flex flex-col gap-2 items-center"></div>

  <!-- Bottom Floating Control Dock -->
  <div class="fixed bottom-6 right-4 z-30 flex flex-col gap-2.5 pointer-events-auto">
    <button onclick="openQuestionModal()" class="liquid-glass-icon p-3.5 rounded-2xl text-slate-800 hover:scale-105 active:scale-95 flex items-center justify-center shadow-xl" title="Ask Question">
      <i data-lucide="message-square-plus" class="w-5 h-5"></i>
    </button>
    <button onclick="toggleRangeModal()" class="liquid-glass-icon p-3.5 rounded-2xl text-slate-800 hover:scale-105 active:scale-95 flex items-center justify-center shadow-xl" title="Radius Filter">
      <i data-lucide="radar" class="w-5 h-5"></i>
    </button>
  </div>

  <!-- Range Filter Modal -->
  <div id="rangeModal" class="hidden fixed bottom-20 right-4 z-40 glass-card p-4.5 rounded-3xl w-72 border border-white/50 shadow-2xl">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <i data-lucide="sliders" class="w-4 h-4 text-sky-600"></i>
        <span class="text-xs font-black text-slate-800 uppercase tracking-wider">Discovery Radius</span>
      </div>
      <button onclick="toggleRangeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="flex items-center gap-3">
      <input type="range" id="radiusSlider" min="10" max="80467" value="8046" oninput="updateRadius(this.value)" class="w-full accent-sky-600 cursor-pointer">
      <span id="radiusValueDisplay" class="text-xs font-bold text-sky-800 min-w-[55px] text-right">5.0 mi</span>
    </div>
  </div>

  <!-- Profile Customization Modal -->
  <div id="profileModal" class="hidden fixed inset-0 z-50 glass-panel bg-slate-900/30 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 border border-white/50 shadow-2xl max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-black text-slate-900">Customize Profile</h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Account Mode</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="selectAccountType('personal')" id="personalTypeBtn" class="p-3 rounded-2xl bg-sky-500/20 border border-sky-400 flex flex-col items-center gap-1 transition-all">
              <i data-lucide="navigation" class="w-4 h-4 text-sky-700"></i>
              <span class="text-[11px] font-bold text-sky-900">Personal (GPS)</span>
            </button>
            <button onclick="selectAccountType('business')" id="businessTypeBtn" class="p-3 rounded-2xl bg-white/40 border border-slate-200 flex flex-col items-center gap-1 transition-all">
              <i data-lucide="store" class="w-4 h-4 text-slate-600"></i>
              <span class="text-[11px] font-bold text-slate-700">Business (Fixed)</span>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Display Alias / Store Name</label>
          <input type="text" id="avatarNameInput" value="Traveler" class="w-full px-4 py-2.5 rounded-2xl bg-white/60 border border-slate-200 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-sky-400 shadow-inner">
        </div>

        <div id="businessAddressField" class="hidden">
          <label class="block text-xs font-bold text-slate-700 mb-1">Store Street Address</label>
          <input type="text" id="businessAddressInput" placeholder="e.g. 123 Ocean Ave, Florida" class="w-full px-4 py-2.5 rounded-2xl bg-white/60 border border-slate-200 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-sky-400 shadow-inner">
        </div>

        <!-- Location Privacy Controls -->
        <div class="pt-2 border-t border-slate-200/60">
          <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Location Privacy & Visibility</label>
          <div class="space-y-2">
            <label class="flex items-center justify-between text-xs font-medium text-slate-700 cursor-pointer">
              <span>Ghost Mode (Invisible on map)</span>
              <input type="checkbox" id="privacyGhostMode" class="w-4 h-4 accent-sky-600 rounded cursor-pointer">
            </label>
            <label class="flex items-center justify-between text-xs font-medium text-slate-700 cursor-pointer">
              <span>Fuzz Location (~500m jitter)</span>
              <input type="checkbox" id="privacyFuzzLocation" checked class="w-4 h-4 accent-sky-600 rounded cursor-pointer">
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">App Theme Preset (Inverted)</label>
          <div class="grid grid-cols-4 gap-2">
            <button onclick="setAppTheme('theme-sky')" class="p-2 rounded-2xl bg-pink-100 border border-pink-300 flex flex-col items-center gap-1 hover:scale-105 transition-all shadow-sm">
              <span class="w-4 h-4 rounded-full bg-pink-400"></span>
              <span class="text-[10px] font-bold text-pink-900">Pink/Blue</span>
            </button>
            <button onclick="setAppTheme('theme-pink')" class="p-2 rounded-2xl bg-sky-100 border border-sky-400 flex flex-col items-center gap-1 hover:scale-105 transition-all shadow-sm">
              <span class="w-4 h-4 rounded-full bg-sky-500"></span>
              <span class="text-[10px] font-bold text-sky-800">Blue/Pink</span>
            </button>
            <button onclick="setAppTheme('theme-emerald')" class="p-2 rounded-2xl bg-fuchsia-100 border border-fuchsia-300 flex flex-col items-center gap-1 hover:scale-105 transition-all shadow-sm">
              <span class="w-4 h-4 rounded-full bg-fuchsia-400"></span>
              <span class="text-[10px] font-bold text-fuchsia-900">Fuchsia</span>
            </button>
            <button onclick="setAppTheme('theme-violet')" class="p-2 rounded-2xl bg-red-100 border border-red-300 flex flex-col items-center gap-1 hover:scale-105 transition-all shadow-sm">
              <span class="w-4 h-4 rounded-full bg-red-400"></span>
              <span class="text-[10px] font-bold text-red-900">Sunset</span>
            </button>
          </div>
        </div>

        <button onclick="saveProfile()" class="w-full py-3.5 rounded-2xl bg-sky-600 text-white font-extrabold text-sm shadow-lg active:scale-98 transition-all">
          Save Profile & Settings
        </button>
      </div>
    </div>
  </div>

  <!-- Outside Tap Backdrop Overlay for Chat Drawer -->
  <div id="chatBackdrop" onclick="closeChatDrawer()" class="hidden fixed inset-0 z-30 bg-slate-900/20 backdrop-blur-xs transition-opacity"></div>

  <!-- Independent Chat Drawer -->
  <div id="chatDrawer" class="hidden fixed top-0 bottom-0 left-0 z-40 w-80 max-w-[85vw] glass-drawer-left p-4.5 flex flex-col transition-all">
    <div class="flex items-center justify-between pb-3.5 pt-2 border-b border-white/30">
      <div class="flex items-center gap-3">
        <div id="chatTargetAvatar" class="w-9 h-9 rounded-full peer-bubble-node text-white font-bold text-xs flex items-center justify-center shadow-md">
          <div class="bubble-glare"></div>
        </div>
        <div>
          <h4 id="chatTargetName" class="font-black text-slate-900 text-sm drop-shadow-sm">Proximity Session</h4>
          <p id="chatTargetStatus" class="text-[10px] text-sky-900 font-bold uppercase tracking-wider">Topic-Isolated Chat Room</p>
        </div>
      </div>
      <button onclick="closeChatDrawer()" class="text-slate-700 hover:text-slate-900 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <div id="mainTopicContainer" class="hidden my-3 p-3.5 rounded-2xl bg-white/40 backdrop-blur-md border border-white/50 shadow-sm flex items-start gap-2.5">
      <i data-lucide="pin" class="w-4 h-4 text-sky-700 flex-shrink-0 mt-0.5"></i>
      <div>
        <p id="mainTopicText" class="text-xs font-bold text-slate-900 leading-snug"></p>
        <span id="topicExpiryBadge" class="text-[9px] font-bold text-sky-800 mt-1 block">Visible for 60m 00s</span>
      </div>
    </div>

    <div id="chatMessages" class="flex-1 overflow-y-auto py-2 space-y-3.5"></div>

    <div class="flex gap-2 pt-3.5 border-t border-white/30">
      <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 px-4 py-2.5 rounded-full bg-white/40 backdrop-blur-md border border-white/40 text-slate-900 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-sky-400" onkeypress="if(event.key==='Enter') sendChatMessage()">
      <button onclick="sendChatMessage()" class="w-9 h-9 rounded-full bg-sky-600 text-white font-bold flex items-center justify-center shadow-md active:scale-95 transition-all flex-shrink-0">
        <i data-lucide="arrow-up" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Question Modal -->
  <div id="questionModal" class="hidden fixed inset-0 z-50 glass-panel bg-slate-900/30 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 border border-white/50 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-black text-slate-900">Ask Nearby People</h3>
        <button onclick="closeQuestionModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-4">
        <textarea id="questionInput" rows="3" placeholder="Post a topic question (expires in 1 hour)..." class="w-full p-4 rounded-2xl bg-white/60 border border-slate-200 text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-sky-400 resize-none shadow-inner"></textarea>
        <button onclick="postQuestion()" class="w-full py-3.5 rounded-2xl bg-sky-600 text-white font-extrabold text-sm shadow-lg active:scale-98 transition-all">
          Post Map Bubble
        </button>
      </div>
    </div>
  </div>

  <script>
    const MESH_PREFIX = 'local-proximity-mesh-v2-';
    const ONE_HOUR_MS = 60 * 60 * 1000;
    const METERS_PER_MILE = 1609.34;
    const STORAGE_KEY_PROFILE = 'local_user_profile_v1';
    const STORAGE_KEY_CHATS = 'local_chat_sessions_v1';

    let peer = null;
    let myPeerId = null;
    let activeConnections = {};
    let processedMsgIds = new Set();
    let nearbyPeers = {};
    
    let activeTopicState = { text: null, createdAt: null };
    let currentActiveChatRoomId = null;
    let chatRoomsSessions = {}; 
    let activeChatRoomsList = new Set(); 

    let userState = {
      alias: 'Traveler',
      type: 'personal',
      address: '',
      radius: 8046,
      lat: 27.2730,
      lng: -80.3582,
      theme: 'theme-sky',
      ghostMode: false,
      fuzzLocation: true
    };

    let touchTimer = null;
    let isLongPress = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadPersistentData();
      lucide.createIcons();
      initGPSLocation();
      initUserNode();
      initRobustMesh();
      checkChatExpiryLoop();
    });

    function loadPersistentData() {
      try {
        const savedProfile = localStorage.getItem(STORAGE_KEY_PROFILE);
        if (savedProfile) {
          const parsed = JSON.parse(savedProfile);
          userState = { ...userState, ...parsed };
          document.getElementById('avatarNameInput').value = userState.alias;
          document.getElementById('businessAddressInput').value = userState.address || '';
          document.getElementById('privacyGhostMode').checked = !!userState.ghostMode;
          document.getElementById('privacyFuzzLocation').checked = userState.fuzzLocation !== false;
          selectAccountType(userState.type || 'personal', true);
          setAppTheme(userState.theme || 'theme-sky', true);
        }

        const savedChats = localStorage.getItem(STORAGE_KEY_CHATS);
        if (savedChats) {
          chatRoomsSessions = JSON.parse(savedChats);
          Object.keys(chatRoomsSessions).forEach(roomId => {
            if (roomId !== 'room-you') {
              registerActiveChat(roomId, roomId.replace('room-peer-', ''));
            }
          });
        }
      } catch (e) {
        console.warn("Failed to load persistent storage:", e);
      }
    }

    function savePersistentData() {
      try {
        localStorage.setItem(STORAGE_KEY_PROFILE, JSON.stringify(userState));
        localStorage.setItem(STORAGE_KEY_CHATS, JSON.stringify(chatRoomsSessions));
      } catch (e) {
        console.warn("Failed to save persistent storage:", e);
      }
    }

    function showToast(message, icon = 'info') {
      const toastContainer = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'glass-card px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2.5 text-slate-800 text-xs font-bold border border-white/50';
      toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 text-sky-600"></i> <span>${message}</span>`;
      toastContainer.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => { toast.remove(); }, 3500);
    }

    function getBroadcastCoordinates() {
      if (!userState.lat || !userState.lng) return { lat: 27.2730, lng: -80.3582 };
      if (!userState.fuzzLocation) return { lat: userState.lat, lng: userState.lng };

      const jitterLat = (Math.random() - 0.5) * 0.005;
      const jitterLng = (Math.random() - 0.5) * 0.005;
      return {
        lat: userState.lat + jitterLat,
        lng: userState.lng + jitterLng
      };
    }

    function initGPSLocation() {
      if (userState.type === 'personal' && navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
          userState.lat = pos.coords.latitude;
          userState.lng = pos.coords.longitude;
          announcePresence();
        }, (err) => {}, { enableHighAccuracy: true });
      }
    }

    function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    function createBubbleRipple() {
      const circle = document.getElementById('userAvatarCircle');
      const rect = circle.getBoundingClientRect();
      const rippleContainer = document.getElementById('tapRippleContainer');
      const ripple = document.createElement('div');
      
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      ripple.className = 'absolute w-14 h-14 rounded-full border border-sky-400/50 bg-sky-300/15 pointer-events-none animate-water-ripple';
      ripple.style.left = `${centerX}px`;
      ripple.style.top = `${centerY}px`;

      rippleContainer.appendChild(ripple);
      setTimeout(() => ripple.remove(), 10710);
    }

    function initUserNode() {
      const container = document.getElementById('nodesContainer');
      const userDiv = document.createElement('div');
      userDiv.id = 'userAvatarNode';
      userDiv.className = 'absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 cursor-pointer';
      
      userDiv.innerHTML = `
        <div class="relative flex flex-col items-center group">
          <div id="userTopBubble" class="hidden mb-2 px-3.5 py-1.5 rounded-2xl glass-card text-xs font-bold text-slate-900 shadow-lg border border-white/50 flex items-center gap-1.5 animate-float cursor-pointer" onclick="openChatDrawer('room-you', '${userState.alias}', activeTopicState.text, 'you')">
            <i data-lucide="message-circle" class="w-3.5 h-3.5 text-sky-600"></i>
            <span id="userTopBubbleText">...</span>
            <span id="userTopBubbleBadge" class="ml-1 text-[9px] text-sky-800 font-extrabold bg-sky-500/20 px-1.5 py-0.5 rounded-md">60m</span>
          </div>

          <div id="userAvatarGlow" class="absolute -inset-3 rounded-full bg-sky-400/25 blur-md animate-pulse-glow pointer-events-none"></div>
          <div id="holdRing" class="absolute -inset-2 rounded-full border-2 border-sky-400 opacity-0 transition-all pointer-events-none"></div>

          <div id="userAvatarCircle" class="w-[51px] h-[51px] rounded-full bubble-node text-white font-black flex items-center justify-center shadow-2xl animate-bubble-subtle">
            <div class="bubble-glare"></div>
          </div>
          <span id="userAvatarLabel" class="mt-1.5 px-3 py-0.5 rounded-full glass-panel text-[11px] font-extrabold text-slate-900 shadow-md">${userState.alias} (You)</span>
        </div>
      `;
      container.appendChild(userDiv);

      const circle = document.getElementById('userAvatarCircle');
      circle.addEventListener('mousedown', () => { createBubbleRipple(); handlePressStart(); });
      circle.addEventListener('mouseup', handlePressEnd);
      circle.addEventListener('mouseleave', handlePressCancel);

      circle.addEventListener('touchstart', (e) => {
        createBubbleRipple();
        handlePressStart();
      });
      circle.addEventListener('touchend', handlePressEnd);
      circle.addEventListener('touchcancel', handlePressCancel);
    }

    function handlePressStart() {
      isLongPress = false;
      const ring = document.getElementById('holdRing');
      ring.classList.remove('opacity-0', 'scale-90');
      ring.classList.add('opacity-100', 'scale-110');

      touchTimer = setTimeout(() => {
        isLongPress = true;
        ring.classList.add('opacity-0');
        openProfileModal();
      }, 500);
    }

    function handlePressEnd() {
      clearTimeout(touchTimer);
      const ring = document.getElementById('holdRing');
      ring.classList.add('opacity-0');
      ring.classList.remove('scale-110');

      if (!isLongPress) {
        const circle = document.getElementById('userAvatarCircle');
        circle.classList.remove('animate-jiggle');
        void circle.offsetWidth;
        circle.classList.add('animate-jiggle');
      }
    }

    function handlePressCancel() {
      clearTimeout(touchTimer);
      const ring = document.getElementById('holdRing');
      ring.classList.add('opacity-0');
    }

    function initRobustMesh() {
      const uniqueSuffix = Math.random().toString(36).substring(2, 8);
      myPeerId = MESH_PREFIX + uniqueSuffix;
      
      peer = new Peer(myPeerId);

      peer.on('open', (id) => {
        myPeerId = id;
        updateMeshUI();
        startPeerDiscoveryLoop();
      });

      peer.on('connection', (conn) => {
        bindConnectionEvents(conn);
      });

      peer.on('error', (err) => {
        console.warn("PeerJS error:", err);
      });
    }

    function startPeerDiscoveryLoop() {
      const seedIds = [
        MESH_PREFIX + 'seed1',
        MESH_PREFIX + 'seed2',
        MESH_PREFIX + 'alpha',
        MESH_PREFIX + 'beta'
      ];

      seedIds.forEach(targetId => {
        if (targetId !== myPeerId && !activeConnections[targetId]) {
          tryConnectPeer(targetId);
        }
      });

      setInterval(() => {
        announcePresence();
      }, 10000);
    }

    function tryConnectPeer(peerId) {
      if (activeConnections[peerId]) return;
      try {
        const conn = peer.connect(peerId, { reliable: true });
        if (conn) bindConnectionEvents(conn);
      } catch (e) {}
    }

    function announcePresence() {
      if (userState.ghostMode) return;

      const coords = getBroadcastCoordinates();
      broadcastData({
        id: 'ping-' + Math.random().toString(36).substring(2, 9),
        type: 'PEER_PRESENCE',
        sender: userState.alias,
        peerId: myPeerId,
        lat: coords.lat,
        lng: coords.lng,
        question: activeTopicState.text,
        createdAt: activeTopicState.createdAt
      });
    }

    function bindConnectionEvents(conn) {
      conn.on('open', () => {
        activeConnections[conn.peer] = conn;
        updateMeshUI();
        announcePresence();

        conn.send({ type: 'REQUEST_STATE', senderId: myPeerId });

        if (activeTopicState.text && (Date.now() - activeTopicState.createdAt < ONE_HOUR_MS)) {
          const coords = getBroadcastCoordinates();
          conn.send({ 
            id: 'msg-' + Math.random().toString(36).substring(2, 9),
            type: 'NEW_QUESTION', 
            text: activeTopicState.text, 
            createdAt: activeTopicState.createdAt,
            sender: userState.alias,
            peerId: myPeerId,
            lat: coords.lat, 
            lng: coords.lng 
          });
        }
      });

      conn.on('data', (data) => {
        if (!data) return;

        if (data.type === 'REQUEST_STATE') {
          if (activeTopicState.text) {
            const coords = getBroadcastCoordinates();
            conn.send({
              id: 'sync-' + Math.random().toString(36).substring(2, 9),
              type: 'NEW_QUESTION',
              text: activeTopicState.text,
              createdAt: activeTopicState.createdAt,
              sender: userState.alias,
              peerId: myPeerId,
              lat: coords.lat,
              lng: coords.lng
            });
          }
          return;
        }

        if (data.id && processedMsgIds.has(data.id)) return;
        if (data.id) processedMsgIds.add(data.id);

        broadcastData(data, conn.peer);

        const distance = calculateHaversineDistance(userState.lat, userState.lng, data.lat, data.lng);
        if (userState.radius > 0 && distance > userState.radius) return;

        let distanceFormatted = distance >= 1000 
          ? (distance / METERS_PER_MILE).toFixed(1) + 'mi' 
          : distance + 'm';

        if (data.type === 'PEER_PRESENCE' || data.type === 'NEW_QUESTION') {
          updatePeerNodeOnMap(data.sender || 'Peer', distance, distanceFormatted, data.lat, data.lng, data.text || data.question, data.createdAt, data.peerId);
          if (data.peerId && data.peerId !== myPeerId && !activeConnections[data.peerId]) {
            tryConnectPeer(data.peerId);
          }
        }

        if (data.type === 'NEW_QUESTION') {
          if (Date.now() - data.createdAt < ONE_HOUR_MS) {
            updatePeerNodeOnMap(data.sender || 'Peer', distance, distanceFormatted, data.lat, data.lng, data.text, data.createdAt, data.peerId);
            showToast(`Question from ${data.sender || 'Peer'} (${distanceFormatted} away)!`, 'pin');
          }
        } else if (data.type === 'CHAT_MSG') {
          const targetRoomId = data.roomId;
          if (!targetRoomId) return;

          if (!chatRoomsSessions[targetRoomId]) chatRoomsSessions[targetRoomId] = [];
          chatRoomsSessions[targetRoomId].push({ sender: data.sender, text: data.text, isMe: false });
          savePersistentData();

          registerActiveChat(targetRoomId, data.roomName || data.sender);

          if (currentActiveChatRoomId === targetRoomId) {
            appendMessage(data.sender, data.text, false);
          } else {
            showToast(`New message in "${data.roomName || data.sender}"!`, 'message-square');
          }
        }
      });

      conn.on('close', () => {
        delete activeConnections[conn.peer];
        updateMeshUI();
      });
    }

    function updatePeerNodeOnMap(alias, distance, distanceFormatted, lat, lng, question, createdAt, peerId) {
      const container = document.getElementById('nodesContainer');
      let peerKey = 'node-' + (peerId || alias).replace(/[^a-zA-Z0-9]/g, '-');
      let nodeElem = document.getElementById(peerKey);

      let angle = (alias.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0) % 360) * (Math.PI / 180);
      let screenRadius = Math.min(Math.max(distance * 0.005, 80), 160);
      let leftPx = `calc(50% + ${Math.cos(angle) * screenRadius}px)`;
      let topPx = `calc(50% + ${Math.sin(angle) * screenRadius}px)`;

      let hasValidQuestion = question && createdAt && (Date.now() - createdAt < ONE_HOUR_MS);
      let roomId = 'room-peer-' + (peerId || alias).replace(/[^a-zA-Z0-9]/g, '-');

      if (!nodeElem) {
        nodeElem = document.createElement('div');
        nodeElem.id = peerKey;
        nodeElem.className = 'absolute z-10 cursor-pointer -translate-x-1/2 -translate-y-1/2 transition-all duration-500';
        container.appendChild(nodeElem);
      }

      nodeElem.style.left = leftPx;
      nodeElem.style.top = topPx;

      nodeElem.innerHTML = `
        <div class="relative flex flex-col items-center group">
          ${hasValidQuestion ? `
            <div class="mb-2 px-3 py-1 rounded-2xl glass-card text-xs font-bold text-slate-900 shadow-md border border-purple-200 flex items-center gap-1.5 animate-float" onclick="openChatDrawer('${roomId}', '${alias}', '${question}', '${alias}')">
              <i data-lucide="message-circle" class="w-3.5 h-3.5 text-purple-600"></i>
              <span>${question.length > 22 ? question.substring(0, 20) + '...' : question}</span>
            </div>
          ` : ''}
          <div onclick="openChatDrawer('${roomId}', '${alias}', '${question || ''}', '${alias}')" class="w-11 h-11 rounded-full peer-bubble-node text-white font-black flex items-center justify-center shadow-lg animate-bubble-subtle">
            <div class="bubble-glare"></div>
          </div>
          <span class="mt-1 px-2.5 py-0.5 rounded-full glass-panel text-[10px] font-extrabold text-slate-800 shadow-sm">${alias} (${distanceFormatted})</span>
        </div>
      `;
      lucide.createIcons();

      nearbyPeers[peerKey] = { elem: nodeElem, createdAt: createdAt };
    }

    function broadcastData(payload, excludePeerId = null) {
      if (userState.ghostMode) return;

      const coords = getBroadcastCoordinates();
      payload.lat = payload.lat || coords.lat;
      payload.lng = payload.lng || coords.lng;

      Object.keys(activeConnections).forEach((peerId) => {
        if (peerId !== excludePeerId) {
          const conn = activeConnections[peerId];
          if (conn && conn.open) conn.send(payload);
        }
      });
    }

    function checkChatExpiryLoop() {
      setInterval(() => {
        if (activeTopicState.createdAt) {
          const elapsed = Date.now() - activeTopicState.createdAt;
          const remainingMs = ONE_HOUR_MS - elapsed;

          if (remainingMs <= 0) {
            activeTopicState.text = null;
            activeTopicState.createdAt = null;
            document.getElementById('userTopBubble').classList.add('hidden');
            document.getElementById('mainTopicContainer').classList.add('hidden');
            showToast('Proximity chat expired (1 hour reached)', 'clock');
          } else {
            const minutesLeft = Math.floor(remainingMs / 60000);
            const secondsLeft = Math.floor((remainingMs % 60000) / 1000);
            
            document.getElementById('topicExpiryBadge').innerText = `Visible for ${minutesLeft}m ${secondsLeft < 10 ? '0' : ''}${secondsLeft}s`;
            document.getElementById('userTopBubbleBadge').innerText = `${minutesLeft}m`;
          }
        }
      }, 1000);
    }

    function selectAccountType(type, skipSave = false) {
      userState.type = type;
      const personalBtn = document.getElementById('personalTypeBtn');
      const businessBtn = document.getElementById('businessTypeBtn');
      const addressField = document.getElementById('businessAddressField');

      if (type === 'personal') {
        personalBtn.className = 'p-3 rounded-2xl bg-sky-500/20 border border-sky-400 flex flex-col items-center gap-1 transition-all';
        businessBtn.className = 'p-3 rounded-2xl bg-white/40 border border-slate-200 flex flex-col items-center gap-1 transition-all';
        addressField.classList.add('hidden');
        document.getElementById('accountTypeDisplay').innerText = "Personal (GPS)";
        initGPSLocation();
      } else {
        businessBtn.className = 'p-3 rounded-2xl bg-sky-500/20 border border-sky-400 flex flex-col items-center gap-1 transition-all';
        personalBtn.className = 'p-3 rounded-2xl bg-white/40 border border-slate-200 flex flex-col items-center gap-1 transition-all';
        addressField.classList.remove('hidden');
        document.getElementById('accountTypeDisplay').innerText = "Business (Fixed)";
      }
      if (!skipSave) savePersistentData();
    }

    function setAppTheme(themeClass, skipSave = false) {
      userState.theme = themeClass;
      document.getElementById('appBody').className = `${themeClass} bg-slate-900 text-slate-800 font-sans antialiased overflow-hidden h-screen w-screen relative`;
      if (!skipSave) {
        savePersistentData();
        showToast(`Theme updated with Pink/Blue inverse!`, 'palette');
      }
    }

    function saveProfile() {
      const alias = document.getElementById('avatarNameInput').value.trim();
      const address = document.getElementById('businessAddressInput').value.trim();
      const ghostMode = document.getElementById('privacyGhostMode').checked;
      const fuzzLocation = document.getElementById('privacyFuzzLocation').checked;

      if (alias) {
        userState.alias = alias;
        document.getElementById('userAvatarLabel').innerText = `${alias} (You)`;
      }

      userState.ghostMode = ghostMode;
      userState.fuzzLocation = fuzzLocation;

      if (userState.type === 'business') {
        userState.address = address;
        showToast('Business profile saved for store address!', 'store');
      } else {
        showToast('Personal GPS profile saved!', 'navigation');
      }

      savePersistentData();
      announcePresence();
      closeProfileModal();
    }

    function updateMeshUI() {
      const activeCount = Object.keys(activeConnections).length + 1;
      document.getElementById('activeUserCount').innerText = `${activeCount} Active`;
      const dot = document.getElementById('p2pStatusDot');
      dot.className = activeCount > 1 
        ? 'absolute top-2 right-2 w-2 h-2 rounded-full bg-emerald-400 animate-ping' 
        : 'absolute top-2 right-2 w-2 h-2 rounded-full bg-slate-400';
    }

    function updateRadius(valMeters) {
      const meters = Number(valMeters);
      userState.radius = meters;
      
      let formattedText = meters >= 1000 
        ? (meters / METERS_PER_MILE).toFixed(1) + ' mi' 
        : meters + 'm';
        
      document.getElementById('radiusValueDisplay').innerText = formattedText;
    }

    function postQuestion() {
      const text = document.getElementById('questionInput').value.trim();
      if (!text) return;

      activeTopicState.text = text;
      activeTopicState.createdAt = Date.now();

      document.getElementById('userTopBubbleText').innerText = text.length > 25 ? text.substring(0, 22) + '...' : text;
      document.getElementById('userTopBubble').classList.remove('hidden');
      document.getElementById('mainTopicText').innerText = text;
      document.getElementById('mainTopicContainer').classList.remove('hidden');

      const msgId = 'msg-' + Math.random().toString(36).substring(2, 9);
      processedMsgIds.add(msgId);

      const coords = getBroadcastCoordinates();
      broadcastData({ 
        id: msgId,
        type: 'NEW_QUESTION', 
        text: text, 
        sender: userState.alias,
        peerId: myPeerId,
        lat: coords.lat,
        lng: coords.lng,
        createdAt: activeTopicState.createdAt 
      });

      closeQuestionModal();
      document.getElementById('questionInput').value = '';
      showToast('Question broadcasted across proximity network!', 'pin');
      openChatDrawer('room-you', userState.alias, text, 'you');
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !currentActiveChatRoomId) return;

      appendMessage('You', text, true);

      if (!chatRoomsSessions[currentActiveChatRoomId]) chatRoomsSessions[currentActiveChatRoomId] = [];
      chatRoomsSessions[currentActiveChatRoomId].push({ sender: 'You', text: text, isMe: true });
      savePersistentData();

      input.value = '';

      const msgId = 'msg-' + Math.random().toString(36).substring(2, 9);
      processedMsgIds.add(msgId);

      const activeRoomName = document.getElementById('chatTargetName').innerText;

      broadcastData({ 
        id: msgId,
        type: 'CHAT_MSG', 
        sender: userState.alias,
        roomId: currentActiveChatRoomId,
        roomName: activeRoomName,
        text: text 
      });
    }

    function appendMessage(sender, text, isMe) {
      const msgBox = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      div.innerHTML = `
        <span class="text-[10px] text-slate-800 font-bold px-1 drop-shadow-sm">${sender}</span>
        <div class="px-3.5 py-2 rounded-2xl text-xs max-w-[85%] font-medium ${isMe ? 'bg-sky-600 text-white rounded-br-none shadow-md' : 'bg-white/50 backdrop-blur-md text-slate-900 rounded-bl-none shadow-sm border border-white/40'}">
          ${text}
        </div>
      `;
      msgBox.appendChild(div);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function registerActiveChat(roomId, roomName) {
      activeChatRoomsList.add(JSON.stringify({ id: roomId, name: roomName }));
      renderActiveChatsBar();
    }

    function renderActiveChatsBar() {
      const bar = document.getElementById('activeChatsBar');
      if (activeChatRoomsList.size === 0) {
        bar.classList.add('hidden');
        return;
      }

      bar.classList.remove('hidden');
      bar.innerHTML = '';

      activeChatRoomsList.forEach(roomJson => {
        const room = JSON.parse(roomJson);
        const isSelected = currentActiveChatRoomId === room.id;
        const isSelf = room.id === 'room-you';
        const bubbleClass = isSelf ? 'bubble-node' : 'peer-bubble-node';

        const item = document.createElement('div');
        item.className = `relative cursor-pointer transition-transform hover:scale-110 flex items-center justify-center ${isSelected ? 'ring-2 ring-sky-500 rounded-full' : ''}`;
        item.title = `Chat: ${room.name}`;
        item.innerHTML = `
          <div class="w-8 h-8 rounded-full ${bubbleClass} text-white font-bold text-[10px] flex items-center justify-center shadow-md">
            <div class="bubble-glare"></div>
            <span>${room.name.charAt(0).toUpperCase()}</span>
          </div>
        `;
        item.onclick = () => {
          openChatDrawer(room.id, room.name, room.id === 'room-you' ? activeTopicState.text : null, room.name);
        };
        bar.appendChild(item);
      });
    }

    function openChatDrawer(roomId, roomName, topic, peerId) {
      currentActiveChatRoomId = roomId;
      registerActiveChat(roomId, roomName);

      document.getElementById('chatTargetName').innerText = roomName;
      
      const isSelf = roomId === 'room-you';
      const avatarElem = document.getElementById('chatTargetAvatar');
      avatarElem.className = `w-9 h-9 rounded-full ${isSelf ? 'bubble-node' : 'peer-bubble-node'} text-white font-bold text-xs flex items-center justify-center shadow-md`;
      avatarElem.innerHTML = `<div class="bubble-glare"></div><span>${roomName.charAt(0).toUpperCase()}</span>`;

      if (topic || (isSelf && activeTopicState.text)) {
        document.getElementById('mainTopicText').innerText = topic || activeTopicState.text;
        document.getElementById('mainTopicContainer').classList.remove('hidden');
      } else {
        document.getElementById('mainTopicContainer').classList.add('hidden');
      }

      const msgBox = document.getElementById('chatMessages');
      msgBox.innerHTML = ``;
      if (chatRoomsSessions[currentActiveChatRoomId]) {
        chatRoomsSessions[currentActiveChatRoomId].forEach(msg => {
          appendMessage(msg.sender, msg.text, msg.isMe);
        });
      }

      document.getElementById('chatDrawer').classList.remove('hidden');
      document.getElementById('chatBackdrop').classList.remove('hidden');
    }

    function closeChatDrawer() { 
      document.getElementById('chatDrawer').classList.add('hidden'); 
      document.getElementById('chatBackdrop').classList.add('hidden');
      currentActiveChatRoomId = null;
    }

    function openQuestionModal() { document.getElementById('questionModal').classList.remove('hidden'); }
    function closeQuestionModal() { document.getElementById('questionModal').classList.add('hidden'); }
    function openProfileModal() { document.getElementById('profileModal').classList.remove('hidden'); }
    function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }
    function toggleRangeModal() { document.getElementById('rangeModal').classList.toggle('hidden'); }
    function toggleP2PModal() {}
  </script>
