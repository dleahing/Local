<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LocaL - P2P Proximity Social Network</title>
  
  <!-- Mobile & PWA Configuration -->
  <meta name="theme-color" content="#fbcfe8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LocaL">

  <!-- Tailwind CSS, Lucide Icons & PeerJS (WebRTC) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

  <!-- ========================================== -->
  <!-- 1. STYLES & BACKGROUND EFFECTS SECTION      -->
  <!-- ========================================== -->
  <style>
    :root {
      --zoom-scale: 1;
      --pan-x: 0px;
      --pan-y: 0px;
    }
    @keyframes wave-expand {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(5.7); opacity: 0; }
    }
    @keyframes peer-sonar-pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.6); }
      70% { transform: translate(-50%, -50%) scale(2.1); opacity: 0; box-shadow: 0 0 0 35px rgba(168, 85, 247, 0); }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
    @keyframes bubble-subtle {
      0%, 100% { transform: scale(1); border-radius: 50%; }
      50% { transform: scale(1.02, 0.98); border-radius: 49% 51% 50% 50%; }
    }
    @keyframes bubble-bounce-press {
      0% { transform: scale(1); }
      30% { transform: scale(1.25, 0.75) translateY(4px); }
      50% { transform: scale(0.85, 1.15) translateY(-8px); }
      75% { transform: scale(1.1, 0.9) translateY(-3px); }
      100% { transform: scale(1) translateY(0); }
    }
    @keyframes float-gentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.42; transform: scale(1.08); }
    }

    @keyframes radius-ring-pulse {
      0% { transform: translate(-50%, -50%) scale(0.01); opacity: 0.85; }
      80% { opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    .animate-radius-ripple {
      animation: radius-ring-pulse 2.2s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
    }

    .animate-wave-slow { animation: wave-expand 6s cubic-bezier(0.1, 0.7, 0.3, 1) infinite; }
    .animate-peer-sonar { animation: peer-sonar-pulse 2.2s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; }
    .animate-float { animation: float-gentle 3.8s ease-in-out infinite; }
    .animate-bubble-subtle { animation: bubble-subtle 6s ease-in-out infinite; }
    .animate-bounce-press { animation: bubble-bounce-press 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards; }
    .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }

    /* Expanded Canvas with Smooth Hardware Acceleration */
    #mapCanvas {
      transform: translate3d(var(--pan-x), var(--pan-y), 0) scale(var(--zoom-scale));
      transform-origin: center center;
      will-change: transform;
      cursor: grab;
      touch-action: none;
      transition: transform 0.2s cubic-bezier(0.15, 0.85, 0.35, 1);
    }
    #mapCanvas:active {
      cursor: grabbing;
    }

    .scale-compensator {
      transform: scale(calc(1 / var(--zoom-scale)));
      will-change: transform;
    }

    /* Anti-Overlap Floating Chat Bubble Stack container */
    .node-content-stack {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      pointer-events: none;
      width: max-content;
      max-width: 240px;
    }
    .node-content-stack > * {
      pointer-events: auto;
    }

    .theme-sky { --bg-gradient: radial-gradient(circle at 50% 50%, #fdf2f8 0%, #fbcfe8 50%, #f472b6 100%); --accent: #db2777; }
    .theme-pink { --bg-gradient: radial-gradient(circle at 50% 50%, #e0f2fe 0%, #bae6fd 50%, #38bdf8 100%); --accent: #0284c7; }
    .theme-yellow { --bg-gradient: radial-gradient(circle at 50% 50%, #fefce8 0%, #fef08a 50%, #eab308 100%); --accent: #ca8a04; }
    .theme-emerald { --bg-gradient: radial-gradient(circle at 50% 50%, #fdf4ff 0%, #f5d0fe 50%, #e879f9 100%); --accent: #c084fc; }
    .theme-violet { --bg-gradient: radial-gradient(circle at 50% 50%, #fef2f2 0%, #fecaca 50%, #f87171 100%); --accent: #ef4444; }

    .map-grid-pattern {
      background-image: radial-gradient(#000 1.2px, transparent 1.2px);
      background-size: 40px 40px;
      background-repeat: repeat;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.08);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
    }
    .liquid-glass-icon {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.45) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    .bubble-node {
      position: relative;
      outline: none;
      border: none;
      backdrop-filter: blur(12px) saturate(190%);
      -webkit-backdrop-filter: blur(12px) saturate(190%);
    }
    .bubble-glare {
      position: absolute;
      top: 10%;
      left: 18%;
      width: 42%;
      height: 25%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 50% 50% 0 0;
      transform: rotate(-22deg);
      pointer-events: none;
